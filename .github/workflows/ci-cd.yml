name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run RAG & Agent Unit Tests
        run: |
          PYTHONPATH=backend python -c "import sys; sys.path.insert(0, 'backend'); from tests.test_rag_and_agents import test_intent_classification, test_guardrails_blocks_injection, test_abstention_on_empty_context, test_relevance_retrieval_scoring; test_intent_classification(); test_guardrails_blocks_injection(); test_abstention_on_empty_context(); test_relevance_retrieval_scoring(); print('Backend Tests Passed!')"

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Build frontend
        run: |
          cd frontend
          npm run build
